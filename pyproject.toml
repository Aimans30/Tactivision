[project]
name = "tactivision"
version = "0.2.0"
description = "AI-powered football video intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
data = ["SoccerNet>=0.1.62"]
detection = [
    "torch>=2.2",
    "ultralytics>=8.3",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
